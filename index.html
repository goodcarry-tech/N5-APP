<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N5 日文隨機造句產生器 (語音朗讀版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        select, option { font-size: 1rem; padding: 0.5rem; }
    </style>
</head>
<body class="bg-slate-100 p-4 md:p-8 font-sans text-slate-800">
    <div class="max-w-5xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-4 text-indigo-700">N5 綜合文法隨機造句產生器 (語音聽寫版)</h1>
        <p class="text-gray-600 mb-6 text-sm">內建 20 組擴充素材與 Web Speech API，支援一鍵生成、複製與日文自動朗讀。</p>
        
        <div class="mb-6">
            <label class="block text-sm font-semibold mb-2 text-gray-700">選擇要練習的 N5 文法句型：</label>
            <select id="grammarPattern" class="w-full border border-indigo-300 p-3 rounded focus:ring-2 focus:ring-indigo-500 outline-none bg-indigo-50">
                <optgroup label="【指定圖解句型】">
                    <option value="1">1. 複合身分：N1 は [國家]人で、[職業] です。</option>
                    <option value="2">2. 介紹他人：ごしょうかいします。こちらは N1さんです。N1さんは...</option>
                    <option value="3">3. 附和同感：N1 は [職業] です。N2 も [職業] です / おなじです。</option>
                </optgroup>
                <optgroup label="【N5 核心：存在與移動】">
                    <option value="4">4. 存在 (無生命)：[場所] に [物品] が あります。</option>
                    <option value="5">5. 存在 (有生命)：[場所] に [人物] が います。</option>
                    <option value="6">6. 移動動詞：[人物] は [場所] へ 行きます。</option>
                </optgroup>
                <optgroup label="【N5 核心：動作與變化】">
                    <option value="7">7. 動作發生地：[人物] は [場所] で [物品] を [動作-ます]。</option>
                    <option value="8">8. 否定式：[人物] は [物品] を [動作-ません]。</option>
                    <option value="9">9. 過去式：[人物] は [場所] で [物品] を [動作-ました]。</option>
                    <option value="10">10. 請求 (て形)：[物品] を [動作-て] ください。</option>
                    <option value="11">11. 進行狀態 (て形)：[人物] は 今、[物品] を [動作-て] います。</option>
                    <option value="12">12. 願望 (たい)：[人物] は [物品] を [動作-たい] です。</option>
                </optgroup>
                <optgroup label="【N5 核心：描述與原因】">
                    <option value="13">13. 喜好：[人物] は [物品] が 好きです。</option>
                    <option value="14">14. 原因：今日は [天氣] ですから、[心情] です。</option>
                    <option value="15">15. 勸誘：いっしょに [場所] で [物品] を [動作-ませんか]。</option>
                </optgroup>
            </select>
        </div>

        <div class="flex flex-wrap gap-4 mb-6 items-center bg-gray-50 p-4 rounded-lg border border-gray-200">
            <button onclick="generateSentences()" class="bg-indigo-600 text-white px-5 py-2 rounded shadow hover:bg-indigo-700 transition font-bold">
                🎲 生成 10 句
            </button>
            <button onclick="copyText()" class="bg-teal-500 text-white px-5 py-2 rounded shadow hover:bg-teal-600 transition font-bold">
                📋 複製文字
            </button>
            
            <div class="h-8 w-px bg-gray-300 mx-2"></div> <!-- 分隔線 -->
            
            <button onclick="readAloud()" class="bg-rose-500 text-white px-5 py-2 rounded shadow hover:bg-rose-600 transition font-bold flex items-center">
                🔊 朗讀日文
            </button>
            <button onclick="stopSpeech()" class="bg-gray-400 text-white px-4 py-2 rounded shadow hover:bg-gray-500 transition font-bold">
                ⏹️ 停止
            </button>
            
            <div class="ml-2 flex items-center gap-2">
                <label class="text-sm font-semibold text-gray-600">語速:</label>
                <select id="speechRate" class="border border-gray-300 rounded p-1 text-sm outline-none">
                    <option value="1.0">正常 (1.0x)</option>
                    <option value="0.7" selected>慢速聽寫 (0.7x)</option>
                    <option value="0.5">極慢 (0.5x)</option>
                </select>
            </div>
        </div>

        <textarea id="outputText" class="w-full h-96 border border-gray-300 p-4 rounded bg-white text-gray-800 outline-none focus:ring-2 focus:ring-indigo-300 leading-relaxed font-mono text-sm shadow-inner" readonly placeholder="生成的句子會顯示在這裡..."></textarea>

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function getTwoDistinctChars() {
            let c1 = getRandom(dict.characters);
            let c2 = getRandom(dict.characters);
            while (c1.ja === c2.ja) { c2 = getRandom(dict.characters); }
            return [c1, c2];
        }

        function generateSentences() {
            const pattern = document.getElementById('grammarPattern').value;
            let output = "";
            currentJapaneseSentences = []; // 重置語音列表

            for (let i = 1; i <= 10; i++) {
                let char = getRandom(dict.characters);
                let country = getRandom(dict.countries);
                let loc = getRandom(dict.locations);
                let obj = getRandom(dict.objects);
                let act = getRandom(dict.actions);
                let prof = getRandom(dict.professions);
                let wea = getRandom(dict.weather);
                let mood = getRandom(dict.moods);

                let ja = "", romaji = "", zh = "";

                switch(pattern) {
                    case "1":
                        ja = `${char.ja}さんは ${country.ja}じんで、${prof.ja}です。`;
                        romaji = `${char.romaji}-san wa ${country.romaji}-jin de, ${prof.romaji} desu.`;
                        zh = `${char.zh}是${country.zh}人，也是${prof.zh}。`;
                        break;
                    case "2":
                        ja = `ごしょうかいします。こちらは ${char.ja}さんです。${char.ja}さんは ${country.ja}のかたで、${prof.ja}です。`;
                        romaji = `Goshoukai shimasu. Kochira wa ${char.romaji}-san desu. ${char.romaji}-san wa ${country.romaji} no kata de, ${prof.romaji} desu.`;
                        zh = `為您介紹一下。這位是${char.zh}。${char.zh}是${country.zh}人，也是${prof.zh}。`;
                        break;
                    case "3":
                        let chars = getTwoDistinctChars();
                        if (Math.random() > 0.5) {
                            ja = `${chars[0].ja}さんは ${prof.ja}です。${chars[1].ja}さんも ${prof.ja}です。`;
                            romaji = `${chars[0].romaji}-san wa ${prof.romaji} desu. ${chars[1].romaji}-san mo ${prof.romaji} desu.`;
                            zh = `${chars[0].zh}是${prof.zh}。${chars[1].zh}也是${prof.zh}。`;
                        } else {
                            ja = `${chars[0].ja}さんは ${prof.ja}です。${chars[1].ja}さんも おなじです。`;
                            romaji = `${chars[0].romaji}-san wa ${prof.romaji} desu. ${chars[1].romaji}-san mo onaji desu.`;
                            zh = `${chars[0].zh}是${prof.zh}。${chars[1].zh}也一樣(是${prof.zh})。`;
                        }
                        break;
                    case "4":
                        ja = `${loc.ja}に ${obj.ja}が あります。`;
                        romaji = `${loc.romaji} ni ${obj.romaji} ga arimasu.`;
                        zh = `在${loc.zh}有${obj.zh}。`;
                        break;
                    case "5":
                        ja = `${loc.ja}に ${char.ja}さんが います。`;
                        romaji = `${loc.romaji} ni ${char.romaji}-san ga imasu.`;
                        zh = `${char.zh}在${loc.zh}。`;
                        break;
                    case "6":
                        ja = `${char.ja}さんは ${loc.ja}へ 行きます。`;
                        romaji = `${char.romaji}-san wa ${loc.romaji} e ikimasu.`;
                        zh = `${char.zh}要去${loc.zh}。`;
                        break;
                    case "7":
                        ja = `${char.ja}さんは ${loc.ja}で ${obj.ja}を ${act.stem}ます。`;
                        romaji = `${char.romaji}-san wa ${loc.romaji} de ${obj.romaji} o ${act.r_stem}masu.`;
                        zh = `${char.zh}在${loc.zh}${act.zh}${obj.zh}。`;
                        break;
                    case "8":
                        ja = `${char.ja}さんは ${obj.ja}を ${act.stem}ません。`;
                        romaji = `${char.romaji}-san wa ${obj.romaji} o ${act.r_stem}masen.`;
                        zh = `${char.zh}不${act.zh}${obj.zh}。`;
                        break;
                    case "9":
                        ja = `${char.ja}さんは ${loc.ja}で ${obj.ja}を ${act.stem}ました。`;
                        romaji = `${char.romaji}-san wa ${loc.romaji} de ${obj.romaji} o ${act.r_stem}mashita.`;
                        zh = `${char.zh}在${loc.zh}${act.zh}了${obj.zh}。`;
                        break;
                    case "10":
                        ja = `すみません、${obj.ja}を ${act.te}ください。`;
                        romaji = `Sumimasen, ${obj.romaji} o ${act.r_te} kudasai.`;
                        zh = `不好意思，請${act.zh}${obj.zh}。`;
                        break;
                    case "11":
                        ja = `${char.ja}さんは 今、${obj.ja}を ${act.te}います。`;
                        romaji = `${char.romaji}-san wa ima, ${obj.romaji} o ${act.r_te} imasu.`;
                        zh = `${char.zh}現在正在${act.zh}${obj.zh}。`;
                        break;
                    case "12":
                        ja = `${char.ja}さんは ${obj.ja}を ${act.stem}たいです。`;
                        romaji = `${char.romaji}-san wa ${obj.romaji} o ${act.r_stem}tai desu.`;
                        zh = `${char.zh}想要${act.zh}${obj.zh}。`;
                        break;
                    case "13":
                        ja = `${char.ja}さんは ${obj.ja}が 好きです。`;
                        romaji = `${char.romaji}-san wa ${obj.romaji} ga suki desu.`;
                        zh = `${char.zh}喜歡${obj.zh}。`;
                        break;
                    case "14":
                        ja = `今日は ${wea.ja}ですから、${char.ja}さんは ${mood.ja}です。`;
                        romaji = `Kyou wa ${wea.romaji} desukara, ${char.romaji}-san wa ${mood.romaji} desu.`;
                        zh = `因為今天是${wea.zh}，所以${char.zh}覺得${mood.zh}。`;
                        break;
                    case "15":
                        ja = `いっしょに ${loc.ja}で ${obj.ja}を ${act.stem}ませんか。`;
                        romaji = `Isshoni ${loc.romaji} de ${obj.romaji} o ${act.r_stem}masenka.`;
                        zh = `要不要一起在${loc.zh}${act.zh}${obj.zh}呢？`;
                        break;
                }

                currentJapaneseSentences.push(ja); // 將生成的日文推入陣列供發音使用
                output += `【${i}】\n假名：${ja}\n羅馬：${romaji}\n中文：${zh}\n------------------------\n`;
            }

            document.getElementById('outputText').value = output;
        }

        // Web Speech API 語音朗讀功能
        function readAloud() {
            if (!('speechSynthesis' in window)) {
                alert("您的瀏覽器不支援語音合成 (Web Speech API)，建議使用最新版 Chrome 或 Safari。");
                return;
            }
            if (currentJapaneseSentences.length === 0) {
                alert("請先點擊「生成 10 句」按鈕！");
                return;
            }

            // 停止當前可能正在播放的語音
            window.speechSynthesis.cancel();
            
            // 取得使用者設定的語速
            const rate = parseFloat(document.getElementById('speechRate').value);

            // 將每句話加入播放佇列，以確保中斷與節奏正常
            currentJapaneseSentences.forEach((sentence) => {
                const utterance = new SpeechSynthesisUtterance(sentence);
                utterance.lang = 'ja-JP'; // 指定日語發音
                utterance.rate = rate;    // 設定語速
                window.speechSynthesis.speak(utterance);
            });
        }

        // 停止朗讀功能
        function stopSpeech() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        function copyText() {
            const textArea = document.getElementById('outputText');
            if(textArea.value.trim() === "") {
                alert("請先點擊生成按鈕！");
                return;
            }
            textArea.select();
            document.execCommand('copy');
            alert("已成功複製 10 組造句！");
        }
        
        generateSentences();
    </script>
</body>
</html>
